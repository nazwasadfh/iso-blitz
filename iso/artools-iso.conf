#!/hint/bash
# shellcheck disable=2034
#
# BlitzArt Linux -- user configuration for artools buildiso.
# make-iso.sh copies this to ~/.config/artools/artools-iso.conf.
# See the default shipped with artools for every possible option.

# dinit is the BlitzArt init system (matches install-1.sh: basestrap ... dinit)
INITSYS="dinit"

# zstd is default; level 15 is a good size/speed tradeoff for a big ISO
COMPRESSION="zstd"
COMPRESSION_LEVEL=15

# ISO release string (appears in the filename)
ISO_VERSION=$(date +%Y%m%d)
