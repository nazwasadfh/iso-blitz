#
# BlitzArt Linux -- pacman.conf used by buildiso for the build chroots.
# make-iso.sh copies this to ~/.config/artools/pacman.conf.d/iso-x86_64.conf.
#
# Based on artools' default iso-x86_64.conf, with Arch [extra] and [multilib]
# added on top (hyprland, snapper, zsh plugins, ... live in extra, not in the
# Artix repos). Arch mirrors are given explicitly so that the build does not
# depend on mirrorlist-arch before artix-archlinux-support is installed.
#
# NOTE: keep this file in sync with what install-2.sh writes into the
# installed system (it adds the same repos through artix-archlinux-support).

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Misc options
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ----- Artix repositories -----------------------------------------------------

# [system-gremlins]
# Include = /etc/pacman.d/mirrorlist

[system]
Include = /etc/pacman.d/mirrorlist

# [world-gremlins]
# Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

# [galaxy-gremlins]
# Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# ----- Arch repositories (needed for the BlitzArt package set) -----------------

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# ----- Optional third-party repos (uncomment to bake them into the ISO) -------
# install-2.sh normally sets these up for the installed system instead.

# [lib32]
# Include = /etc/pacman.d/mirrorlist
#
# [chaotic-aur]
# Include = /etc/pacman.d/chaotic-mirrorlist
#
# [blackarch]
# Include = /etc/pacman.d/blackarch-mirrorlist
